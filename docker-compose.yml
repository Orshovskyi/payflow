# PayFlow environment.
#   docker compose up -d                  infrastructure only (run the services from the IDE)
#   docker compose --profile app up -d    infrastructure + services in containers (experiments)
# Experiment parameters come from environment variables: STRATEGY (naive|outbox), OUTBOX_POLL_INTERVAL.
# Resource limits are fixed so that every run gets exactly the same CPU and memory.
name: payflow

x-service: &service
  profiles: ["app"]
  restart: "no"
  cpus: 2
  mem_limit: 768m
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    cpus: 2
    mem_limit: 1g
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    cpus: 2
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  wallet-service:
    <<: *service
    image: payflow/wallet-service:latest
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: wallet-service
    environment: &service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYFLOW_CONSISTENCY_STRATEGY: ${STRATEGY:-naive}
      PAYFLOW_OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-50ms}
    ports:
      - "8081:8081"

  transaction-service:
    <<: *service
    image: payflow/transaction-service:latest
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: transaction-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_db
    ports:
      - "8082:8082"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
