global:
  scrape_interval: 5s

# Scrapes the containerised services (docker compose --profile app).
# host.docker.internal is deliberately not listed: with port mapping it reaches the same containers, every series
# would be collected twice, and sums in experiment queries would double.
scrape_configs:
  - job_name: wallet-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["wallet-service:8081"]
  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-service:8082"]
